services:
  ollama:
    # Модель запечена в образ (см. ollama/Dockerfile): первое поднятие не качает ~4-5 ГБ.
    # Можно собрать один раз, запушить в registry и задать OLLAMA_IMAGE — тогда все
    # поднимут стек без какого-либо скачивания модели.
    image: ${OLLAMA_IMAGE:-gpn-ollama:latest}
    build:
      context: ./ollama
      args:
        LLM_MODEL: ${LLM_MODEL:-gemma4:e2b-it-qat}
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - LLM_MODEL=${LLM_MODEL:-gemma4:e2b-it-qat}
    healthcheck:
      # $${LLM_MODEL} — с двойным знаком, чтобы compose не подставлял значение сам
      test: ["CMD-SHELL", "ollama show $${LLM_MODEL}"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    entrypoint: ["/bin/sh", "-c", "ollama serve & for i in $(seq 1 30); do ollama show $${LLM_MODEL} >/dev/null 2>&1 && break; sleep 1; done; ollama show $${LLM_MODEL} >/dev/null 2>&1 || ollama pull $${LLM_MODEL}; wait"]

  langfuse-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${LANGFUSE_DB_USER:-langfuse}
      - POSTGRES_PASSWORD=${LANGFUSE_DB_PASSWORD:-langfuse_secret}
      - POSTGRES_DB=langfuse
    volumes:
      - langfuse_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse:
    image: langfuse/langfuse:2
    ports:
      - "3000:3000"
    depends_on:
      langfuse-db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://langfuse:langfuse_secret@langfuse-db:5432/langfuse
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-hackathon-random-secret-change-me}
      - NEXTAUTH_URL=http://localhost:3000
      - SALT=${LANGFUSE_SALT:-hackathon-salt-change-me}

  gpn_assistant:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./chromadb:/app/chromadb
      - hf_cache:/root/.cache/huggingface
    depends_on:
      ollama:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # python:slim не содержит curl — проверяем через urllib. wARMUP ушёл в фон,
      # поэтому /health отвечает 200 (degraded) сразу после старта uvicorn.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - LLM_MODEL=${LLM_MODEL:-gemma4:e2b-it-qat}
      - LLM_NUM_CTX=${LLM_NUM_CTX:-8192}
      - MAX_HISTORY_TURNS=${MAX_HISTORY_TURNS:-6}
      - OLLAMA_MAX_RETRIES=${OLLAMA_MAX_RETRIES:-3}
      - TRANSFORMERS_OFFLINE=0
      - HF_HUB_DISABLE_TELEMETRY=1
      # Redis
      - REDIS_URL=redis://redis:6379/0
      # Langfuse tracing (опционально)
      - LANGFUSE_HOST=http://langfuse:3000
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  ollama_data:
  hf_cache:
  langfuse_data:
  redis_data: